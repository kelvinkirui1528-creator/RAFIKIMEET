                        className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold border border-slate-700"
                      >
                        {copyEmailSuccess ? '✓ Copied' : '📋 Copy Email'}
                      </button>
                      <button
                        onClick={() => openDirectGmail('inquiry', 'Account Help')}
                        className="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold shadow"
                      >
                        Compose in Gmail ↗
                      </button>
                    </div>
                  </div>
                </div>
                  </>
                )}

                {/* ================= SAFETY & COMMUNITY GUIDELINES SECTION ================= */}
                <div className="pt-4 border-t border-slate-800 space-y-4">
                  <div className="bg-gradient-to-r from-rose-950/60 to-slate-800 border border-rose-500/30 rounded-3xl p-6 shadow-xl">
                    <h3 className="text-xl sm:text-2xl font-bold text-white mb-1 flex items-center gap-2">
                      <span>🛡️</span>
                      <span>Safety & Community Guidelines</span>
                    </h3>
                    <p className="text-xs text-rose-300 font-semibold mb-3">18+ Adults Only Platform</p>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      RafikiMeet is a safe, friendly space for adults aged 18 and over to connect. 
                      Respect, mutual consent, privacy, and member safety are our highest priorities.
                    </p>
                  </div>

                  <div className="bg-rose-950/40 border border-rose-500/40 rounded-2xl p-4 text-xs text-slate-300 space-y-1">
                    <h4 className="font-bold text-rose-300 text-sm flex items-center gap-1.5">
                      <span>🚨</span>
                      <span>Emergency Hotlines (Kenya)</span>
                    </h4>
                    <p>In case of an urgent emergency or threat, immediately contact national emergency services:</p>
                    <p className="font-bold text-white pt-1">
                      Police & Emergency: <span className="text-rose-400 font-mono text-sm">999</span> or <span className="text-rose-400 font-mono text-sm">112</span>
                    </p>
                  </div>

                  <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 space-y-3 text-xs text-slate-300 leading-relaxed">
                    <h4 className="text-base font-bold text-white mb-2 flex items-center gap-2">
                      <span>🔒</span>
                      <span>Member Safety Rules</span>
                    </h4>
                    <p>• <strong>Never share financial information:</strong> Never share your mobile money PIN, passwords, or send money to people you have just met.</p>
                    <p>• <strong>Meeting in person:</strong> If you choose to meet a friend in person, always pick a busy public location during the day and inform someone you trust.</p>
                    <p>• <strong>Strictly 18+:</strong> Underage accounts are immediately banned.</p>
                    <p>• <strong>Zero tolerance for harassment:</strong> Any abusive or non-consensual behavior results in an immediate permanent ban.</p>
                  </div>
                </div>
              </div>
            )}


          </main>

          {/* ================= LIVE WEBRTC CALL OVERLAY ================= */}
          {(isCallActive || isRandomMatching || matchedUser) && (
            <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-between select-none">
              {/* Top in-call header */}
              <div className="p-4 bg-gradient-to-b from-black/90 to-transparent flex items-center justify-between z-20">
                <div className="flex items-center gap-3">
                  <div className="text-white">
                    <h4 className="font-bold text-sm sm:text-base">
                      {matchedUser ? `@${matchedUser.username}, ${matchedUser.age}` : (activeVideoUser ? `@${activeVideoUser.username}` : 'Searching...')}
                    </h4>
                    <div className="flex items-center gap-2 mt-0.5">
                      <p className="text-[11px] text-emerald-400 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                        {matchedUser || activeVideoUser ? formatTime(callDuration) : 'Connecting WebRTC...'}
                      </p>
                      <span className="hidden sm:inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                        HD 1080p • Studio Audio Active
                      </span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  {matchedUser && (
                    <button
                      onClick={() => toggleSaveUser(matchedUser.id)}
                      className={`p-2 rounded-full border ${savedIds.includes(matchedUser.id) ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300'}`}
                      title="Save Profile"
                    >
                      ❤️
                    </button>
                  )}
                  <button
                    onClick={() => setShowInCallChat(!showInCallChat)}
                    className={`p-2 rounded-full border transition ${showInCallChat ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                    title="Toggle Live In-Call Text Chat"
                  >
                    💬
                  </button>
                  <button
                    onClick={() => setReportTargetUser(matchedUser || activeVideoUser)}
                    className="p-2 rounded-full bg-slate-800 text-slate-300 hover:text-rose-400"
                    title="Report / Block"
                  >
                    🛡️
                  </button>
                </div>
              </div>

              {/* Main Video View with Filters */}
              <div className="flex-1 relative flex items-center justify-center bg-slate-900 overflow-hidden">
                {isRandomMatching ? (
                  <div className="text-center p-6">
                    <div className="w-16 h-16 border-4 border-rose-500 border-t-transparent rounded-full animate-spin mx-auto mb-4" />
                    <h3 className="font-bold text-white text-lg">Looking for an active partner...</h3>
                    <p className="text-xs text-slate-400">Matching with adults 18+ on RafikiMeet</p>
                  </div>
                ) : (
                  <>
                    <video
                      ref={remoteVideoRef}
                      autoPlay
                      playsInline
                      className={`w-full h-full object-cover ${videoFilter !== 'none' ? `filter-${videoFilter}` : ''}`}
                    />
                    {!remoteVideoRef.current?.srcObject && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 pointer-events-none p-6 text-center">
                        <img src={resolveAvatar(activeVideoUser?.avatarUrl)} className="w-24 h-24 rounded-full border-2 border-rose-500/50 object-cover mb-3 animate-pulse shadow-xl shadow-rose-500/25" />
                        <h4 className="font-bold text-white text-lg">@{activeVideoUser?.username}</h4>
                        <p className="text-xs text-rose-400 mt-1 flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                          Connecting live video stream...
                        </p>
                      </div>
                    )}

                    {/* Local User PiP */}
                    <div className="absolute bottom-24 right-4 w-28 h-40 sm:w-44 sm:h-60 rounded-2xl overflow-hidden shadow-2xl border-2 border-slate-700 bg-slate-950 z-10">
                      <video
                        ref={localVideoRef}
                        autoPlay
                        playsInline
                        muted
                        className={`w-full h-full object-cover ${isVideoOff ? 'hidden' : ''} ${videoFilter !== 'none' ? `filter-${videoFilter}` : ''}`}
                      />
                      {isVideoOff && (
                        <div className="w-full h-full flex items-center justify-center text-xs text-slate-500">Camera Off</div>
                      )}
                      <div className="absolute top-2 left-2 bg-black/60 px-1.5 py-0.5 rounded text-[10px] text-white">You</div>
                    </div>

                    {/* Floating In-Call Live Chat Drawer */}
                    {showInCallChat && (
                      <div className="absolute top-20 left-4 sm:left-6 w-72 sm:w-80 max-h-80 bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-2xl p-3 flex flex-col z-20 shadow-2xl">
                        <div className="flex justify-between items-center pb-2 border-b border-slate-700/80 mb-2">
                          <span className="text-xs font-bold text-white">In-Call Messages</span>
                          <button onClick={() => setShowInCallChat(false)} className="text-xs text-slate-400 hover:text-white">✕</button>
                        </div>
                        <div className="flex-1 overflow-y-auto space-y-1.5 mb-2 max-h-48 text-xs">
                          {inCallMessages.length === 0 ? (
                            <p className="text-[11px] text-slate-400 italic text-center py-4">Share handles, links, or text notes during your call.</p>
                          ) : (
                            inCallMessages.map(m => (
                              <div key={m.id} className="p-1.5 rounded-lg bg-slate-800 border border-slate-700/60">
                                <span className="font-bold text-rose-400 text-[10px]">{m.sender}: </span>
                                <span className="text-slate-200 text-xs">{m.text}</span>
                              </div>
                            ))
                          )}
                        </div>
                        <div className="flex gap-1.5">
                          <input
                            type="text"
                            placeholder="Type in-call message..."
                            value={inCallInput}
                            onChange={e => setInCallInput(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && sendInCallMessage(inCallInput)}
                            className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                          />
                          <button onClick={() => sendInCallMessage(inCallInput)} className="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-bold">
                            Send
                          </button>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>

              {/* Bottom In-Call Floating Controls */}
              <div className="p-4 bg-gradient-to-t from-black/95 to-transparent flex items-center justify-center gap-2.5 sm:gap-3 z-20 safe-pb">
                <button
                  onClick={toggleAudio}
                  className={`p-3.5 rounded-full border ${isMuted ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-800/90 text-white border-slate-700'}`}
                  title={isMuted ? 'Unmute Mic' : 'Mute Mic'}
                >
                  {isMuted ? '🔇' : '🎙️'}
                </button>

                <button
                  onClick={toggleVideo}
                  className={`p-3.5 rounded-full border ${isVideoOff ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-800/90 text-white border-slate-700'}`}
                  title={isVideoOff ? 'Camera On' : 'Camera Off'}
                >
                  {isVideoOff ? '🚫' : '📹'}
                </button>

                {/* Filter preset cycle button */}
                <button
                  onClick={cycleFilter}
                  className="p-3.5 rounded-full bg-slate-800/90 text-white border border-slate-700 hover:border-rose-500 transition"
                  title={`Visual Filter: ${videoFilter.toUpperCase()}`}
                >
                  ✨
                </button>

                {/* Omegle-style Next skip button */}
                {matchedUser && (
                  <button
                    onClick={findNextRandom}
                    className="px-6 py-3.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs sm:text-sm shadow-xl shadow-rose-600/30 flex items-center gap-2 hover:scale-105 transition"
                  >
                    <span>Next</span> ➡️
                  </button>
                )}

                <button
                  onClick={endVideoCall}
                  className="px-5 py-3.5 rounded-full bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs shadow-lg transition"
                >
                  End Call ✕
                </button>
              </div>
            </div>
          )}

          {/* ================= INCOMING LIVE VIDEO CALL MODAL ================= */}
          {incomingCall && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-slate-900 border border-rose-500/40 rounded-3xl p-6 sm:p-7 max-w-sm w-full text-center shadow-2xl shadow-rose-950/60 relative overflow-hidden">
                <div className="absolute -top-12 -left-12 w-40 h-40 bg-rose-600/20 rounded-full blur-3xl pointer-events-none" />
                <div className="absolute -bottom-12 -right-12 w-40 h-40 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none" />

                <div className="relative mx-auto w-24 h-24 mb-4">
                  <div className="absolute inset-0 rounded-full bg-rose-500/30 animate-ping" />
                  <img src={incomingCall.callerAvatar} className="w-24 h-24 rounded-full object-cover border-4 border-rose-500 relative z-10 shadow-xl" />
                  <span className="absolute bottom-0 right-0 z-20 text-2xl bg-slate-900 rounded-full p-1 border border-rose-500">📹</span>
                </div>

                <div className="inline-block px-3 py-1 rounded-full bg-rose-500/20 text-rose-400 text-[11px] font-bold uppercase tracking-wider mb-2 animate-pulse">
                  Incoming Live Video Call...
                </div>
                <h3 className="text-xl font-black text-white mb-0.5">@{incomingCall.callerUsername}</h3>
                <p className="text-xs text-slate-400 mb-6">{incomingCall.callerDisplayName || incomingCall.callerUsername} is video calling you right now</p>

                <div className="flex items-center gap-3 justify-center">
                  <button
                    onClick={handleDeclineCall}
                    className="flex-1 py-3 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center justify-center gap-2 border border-slate-700"
                  >
                    <span>✕</span> Decline
                  </button>
                  <button
                    onClick={handleAcceptCall}
                    className="flex-1 py-3 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/40 animate-pulse"
                  >
                    <span>📞</span> Accept Call
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= FLOATING NEW MESSAGE TOAST NOTIFICATION ================= */}
          {messageNotification && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-sm w-[92%] sm:w-auto bg-slate-900/95 border border-rose-500/50 rounded-2xl p-3 shadow-2xl shadow-rose-950/70 backdrop-blur-md flex items-center justify-between gap-3 animate-fade-in">
              <div className="flex items-center gap-2.5 min-w-0">
                <img src={messageNotification.senderAvatar} className="w-8 h-8 rounded-full object-cover border border-rose-500/60 flex-shrink-0" />
                <div className="min-w-0">
                  <div className="text-xs font-bold text-white truncate">New message from @{messageNotification.senderUsername}</div>
                  <div className="text-[11px] text-slate-300 truncate max-w-[180px]">{messageNotification.text}</div>
                </div>
              </div>
              <div className="flex items-center gap-1.5 flex-shrink-0">
                <button
                  onClick={() => {
                    const target = profiles.find(p => p.id === messageNotification.senderId || String(p.username || '').toLowerCase() === String(messageNotification.senderUsername).toLowerCase());
                    if (target) {
                      setActiveChatUser(target);
                      setUnreadCount(0);
                      setCurrentTab('chat');
                    }
                    setMessageNotification(null);
                  }}
                  className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow-md shadow-rose-600/30 transition"
                >
                  Reply
                </button>
                <button
                  onClick={() => setMessageNotification(null)}
                  className="text-slate-400 hover:text-white p-1 text-xs"
                >
                  ✕
                </button>
              </div>
            </div>
          )}

          {/* ================= PHOTO SNAPSHOT / UPLOAD MODAL ================= */}
          {showPhotoModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl overflow-hidden shadow-2xl p-5">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white text-base">Share a Photo</h3>
                  <button onClick={() => setShowPhotoModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="flex border-b border-slate-700 mb-4 text-xs font-bold">
                  <button
                    onClick={() => setPhotoModalMode('camera')}
                    className={`flex-1 py-2 border-b-2 ${photoModalMode === 'camera' ? 'border-rose-500 text-rose-400' : 'border-transparent text-slate-400'}`}
                  >
                    📷 Take Snapshot
                  </button>
                  <button
                    onClick={() => setPhotoModalMode('upload')}
                    className={`flex-1 py-2 border-b-2 ${photoModalMode === 'upload' ? 'border-rose-500 text-rose-400' : 'border-transparent text-slate-400'}`}
                  >
                    🖼️ Pick from Gallery
                  </button>
                </div>

                {photoModalMode === 'camera' ? (
                  <div className="flex flex-col items-center">
                    <div className="w-full h-64 bg-black rounded-2xl overflow-hidden mb-4 border border-slate-700">
                      <video ref={photoCaptureVideoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    </div>
                    <button
                      onClick={captureSnapshot}
                      className="w-16 h-16 rounded-full border-4 border-rose-500 bg-white/20 hover:bg-rose-500/40 flex items-center justify-center transition"
                    >
                      <div className="w-10 h-10 rounded-full bg-rose-500" />
                    </button>
                  </div>
                ) : (
                  <div
                    onClick={() => fileInputRef.current?.click()}
                    className="w-full h-52 border-2 border-dashed border-slate-700 hover:border-rose-500 rounded-2xl flex flex-col items-center justify-center cursor-pointer p-6 text-center bg-slate-900/50"
                  >
                    <span className="text-3xl mb-2">📁</span>
                    <p className="text-xs font-bold text-slate-200">Click to choose image</p>
                    <p className="text-[10px] text-slate-400 mt-1">Automatically resized for quick transfer</p>
                    <input ref={fileInputRef} type="file" accept="image/*" onChange={handleGalleryFile} className="hidden" />
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ================= REPORT MODAL ================= */}
          {reportTargetUser && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-3xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white text-base">Report @{reportTargetUser.username}</h3>
                  <button onClick={() => setReportTargetUser(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {reportSuccess ? (
                  <div className="text-center py-6 text-emerald-400 font-bold text-sm">
                    ✓ Report submitted. Thank you for keeping RafikiMeet safe.
                  </div>
                ) : (
                  <form onSubmit={handleReportSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1">Reason for Report</label>
                      <select
                        value={reportReason}
                        onChange={e => setReportReason(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      >
                        <option value="inappropriate_content">Inappropriate content</option>
                        <option value="harassment">Harassment or abusive behavior</option>
                        <option value="underage">Suspected underage (Must be 18+)</option>
                        <option value="scam">Scam, spam, or financial fraud</option>
                      </select>
                    </div>

                    <button
                      type="button"
                      onClick={() => { blockUser(reportTargetUser.id); setReportTargetUser(null); }}
                      className="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold"
                    >
                      Block User
                    </button>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30"
                    >
                      Submit Report
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ================= AUTHENTICATION MODAL (LOGIN / 18+ SIGNUP) ================= */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-6 sm:p-7 shadow-2xl space-y-4 my-8">
                {/* Modal Header */}
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">💬</span>
                    <h3 className="font-bold text-white text-lg">
                      {authMode === 'signin' ? 'Sign In to RafikiMeet' : authMode === 'signup' ? 'Create 18+ Account' : 'Reset Password'}
                    </h3>
                  </div>
                  <button
                    onClick={() => { setShowAuthModal(false); setAuthError(''); setAuthNotice(''); }}
                    className="text-slate-400 hover:text-white p-1 rounded-lg text-lg"
                  >
                    ✕
                  </button>
                </div>

                {/* Mode Switcher Tabs */}
                {authMode !== 'forgot' && authMode !== 'enter_code' && (
                  <div className="flex bg-slate-900 p-1 rounded-2xl border border-slate-700">
                    <button
                      type="button"
                      onClick={() => { setAuthMode('signin'); setAuthError(''); setAuthNotice(''); }}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${
                        authMode === 'signin' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      🔑 Sign In
                    </button>
                    <button
                      type="button"
                      onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthNotice(''); }}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${
                        authMode === 'signup' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      ✨ Create Account (18+)
                    </button>
                  </div>
                )}

                {/* Notice & Feedback alerts */}
                {authNotice && (
                  <div className="p-3 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs flex items-center gap-2">
                    <span>ℹ️</span>
                    <span>{authNotice}</span>
                  </div>
                )}
                {authError && (
                  <div className="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2">
                    <span>⚠️</span>
                    <span>{authError}</span>
                  </div>
                )}
                {authSuccessMessage && (
                  <div className="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs flex items-center gap-2">
                    <span>✓</span>
                    <span>{authSuccessMessage}</span>
                  </div>
                )}

                {/* 1. SIGN IN FORM */}
                {authMode === 'signin' && (
                  <form onSubmit={handleSignIn} className="space-y-3.5 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="e.g. kelvinkirui1528@gmail.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition"
                      />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-slate-400 font-semibold">Password</label>
                        <button
                          type="button"
                          onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthNotice(''); }}
                          className="text-[11px] text-rose-400 hover:underline"
                        >
                          Forgot password?
                        </button>
                      </div>
                      <input
                        type="password"
                        required
                        placeholder="Enter your password"
                        value={authPassword}
                        onChange={e => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {authLoading ? (
                        <span className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <>
                          <span>🔑</span>
                          <span>Sign In</span>
                        </>
                      )}
                    </button>
                  </form>
                )}

                {/* 2. SIGN UP (18+) FORM */}
                {authMode === 'signup' && (
                  <form onSubmit={handleSignUp} className="space-y-3 text-xs">
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Display Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Kelvin K."
                          value={authDisplayName}
                          onChange={e => setAuthDisplayName(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Username</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. kelvin_254"
                          value={authUsername}
                          onChange={e => setAuthUsername(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, ''))}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="e.g. user@example.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Password (min 6 characters)</label>
                      <input
                        type="password"
                        required
                        minLength="6"
                        placeholder="Create a password"
                        value={authPassword}
                        onChange={e => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Age (Must be 18+)</label>
                        <input
                          type="number"
                          min="18"
                          max="99"
                          required
                          value={authAge}
                          onChange={e => setAuthAge(Number(e.target.value))}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Gender</label>
                        <select
                          value={authGender}
                          onChange={e => setAuthGender(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500"
                        >
                          <option value="female">Female</option>
                          <option value="male">Male</option>
                          <option value="non-binary">Non-binary</option>
                          <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                      </div>
                    </div>

                    {/* Strict 18+ Verification & Terms Checkboxes */}
                    <div className="space-y-2 pt-1">
                      <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded-xl bg-slate-900 border border-rose-500/30">
                        <input
                          type="checkbox"
                          required
                          checked={auth18PlusConfirmed}
                          onChange={e => setAuth18PlusConfirmed(e.target.checked)}
                          className="mt-0.5 w-4 h-4 rounded text-rose-600 focus:ring-rose-500"
                        />
                        <span className="text-[11px] text-rose-300 font-semibold leading-tight">
                          🔞 I confirm that I am at least 18 years old. I understand RafikiMeet is strictly for adults (18+).
                        </span>
                      </label>

                      <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded-xl bg-slate-900 border border-slate-700">
                        <input
                          type="checkbox"
                          required
                          checked={authTermsConfirmed}
                          onChange={e => setAuthTermsConfirmed(e.target.checked)}
                          className="mt-0.5 w-4 h-4 rounded text-rose-600 focus:ring-rose-500"
                        />
                        <span className="text-[11px] text-slate-300 leading-tight">
                          📜 I agree to the Community Safety Guidelines, Terms of Service, and zero tolerance for harassment.
                        </span>
                      </label>
                    </div>

                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {authLoading ? (
                        <span className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <>
                          <span>✨</span>
                          <span>Create 18+ Account</span>
                        </>
                      )}
                    </button>
                  </form>
                )}

                {/* 3. FORGOT PASSWORD FORM */}
                {authMode === 'forgot' && (
                  <form onSubmit={handleForgotPassword} className="space-y-3.5 text-xs">
                    <p className="text-slate-300 text-xs">
                      Enter your account email address and we'll send a password reset link.
                    </p>
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="e.g. kelvinkirui1528@gmail.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('signin'); setAuthError(''); setAuthNotice(''); }}
                        className="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl font-semibold text-xs"
                      >
                        Back to Sign In
                      </button>
                      <button
                        type="submit"
                        disabled={authLoading}
                        className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg text-xs"
                      >
                        Send Reset Link
                      </button>
                    </div>
                  </form>
                )}


              </div>
            </div>
          )}

          {/* ================= PASSWORD RECOVERY MODAL (FROM EMAIL LINK) ================= */}
          {showRecoveryModal && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-rose-500/40 w-full max-w-md rounded-3xl p-6 sm:p-7 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔐</span>
                    <h3 className="font-bold text-white text-base">Reset Your Password</h3>
                  </div>
                  <button
                    onClick={() => setShowRecoveryModal(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg text-lg"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-xs text-slate-300">
                  You verified your account via the email link! Please enter a new secure password for your account.
                </p>

                {recoverySuccess ? (
                  <div className="p-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-center space-y-2">
                    <div className="text-3xl">✓</div>
                    <h4 className="font-bold text-emerald-400 text-sm">Password Updated Successfully!</h4>
                    <p className="text-xs text-slate-300">You are now logged in with your new password.</p>
                  </div>
                ) : (
                  <form onSubmit={handleSetNewPassword} className="space-y-3.5 text-xs">
                    {recoveryError && (
                      <div className="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs">
                        ⚠️ {recoveryError}
                      </div>
                    )}
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">New Password (min 6 characters)</label>
                      <input
                        type="password"
                        required
                        minLength="6"
                        placeholder="Enter your new password"
                        value={recoveryNewPassword}
                        onChange={e => setRecoveryNewPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={recoveryLoading}
                      className="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-xs flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {recoveryLoading ? (
                        <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <span>Save New Password & Log In</span>
                      )}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ================= SUPPORT, FEEDBACK & INQUIRIES MODAL ================= */}
          {showFeedbackModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-6 sm:p-7 shadow-2xl space-y-4 my-8">
                {/* Header */}
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📬</span>
                    <h3 className="font-bold text-white text-base">RafikiMeet Help Desk</h3>
                  </div>
                  <button
                    onClick={() => { setSubmittedTicket(null); setShowFeedbackModal(false); }}
                    className="text-slate-400 hover:text-white p-1 rounded-lg text-lg"
                  >
                    ✕
                  </button>
                </div>

                {submittedTicket ? (
                  /* Success & Direct Email Dispatch Receipt */
                  <div className="space-y-4 py-2">
                    <div className="p-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-center space-y-2">
                      <div className="text-3xl">✓</div>
                      <h4 className="font-bold text-emerald-400 text-base">Ticket #{submittedTicket.id} Created!</h4>
                      <p className="text-xs text-slate-300">
                        Your message has been saved to the support queue and logged for the moderation team.
                      </p>
                    </div>

                    <div className="p-3.5 bg-slate-900 rounded-2xl border border-slate-700/80 space-y-2 text-xs">
                      <div className="flex justify-between items-center text-slate-400">
                        <span>Category:</span>
                        <span className="font-bold text-white capitalize">{submittedTicket.category}</span>
                      </div>
                      <div className="flex justify-between items-center text-slate-400">
                        <span>From:</span>
                        <span className="text-white">{submittedTicket.senderEmail}</span>
                      </div>
                      <div className="flex justify-between items-center text-slate-400">
                        <span>Subject:</span>
                        <span className="font-semibold text-rose-300 truncate max-w-[200px]">{submittedTicket.subject}</span>
                      </div>
                    </div>

                    <p className="text-[11px] text-slate-400 text-center">
                      Want to open a direct email thread with <span className="text-white font-mono">rafikimeetinfo@gmail.com</span>?
                    </p>

                    <div className="space-y-2">
                      <a
                        href={submittedTicket.gmailUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-rose-600/30"
                      >
                        <span>📬</span>
                        <span>Open & Send via Gmail (Web) ↗</span>
                      </a>

                      <div className="flex gap-2">
                        <a
                          href={submittedTicket.mailtoUrl}
                          className="flex-1 py-2 px-3 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-semibold text-center transition"
                        >
                          Default Mail App ✉️
                        </a>
                        <button
                          onClick={copySupportEmail}
                          className="flex-1 py-2 px-3 bg-slate-900 hover:bg-slate-750 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700 transition"
                        >
                          {copyEmailSuccess ? '✓ Copied' : '📋 Copy Email'}
                        </button>
                      </div>

                      <button
                        onClick={() => {
                          setSubmittedTicket(null);
                          setShowFeedbackModal(false);
                          setFeedbackSubject('');
                          setFeedbackMessage('');
                        }}
                        className="w-full py-2 text-slate-400 hover:text-white text-xs font-semibold"
                      >
                        Done & Close
                      </button>
                    </div>
                  </div>
                ) : (
                  /* Form View */
                  <form onSubmit={handleSendFeedback} className="space-y-3.5 text-xs">
                    <p className="text-xs text-slate-300">
                      Submit a question, complaint, or feedback. Inquiries go to <span className="text-rose-400 font-bold">rafikimeetinfo@gmail.com</span>.
                    </p>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Category</label>
                      <select
                        value={feedbackCategory}
                        onChange={e => setFeedbackCategory(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500 transition"
                      >
                        <option value="feedback">💡 Feedback / Feature Suggestion</option>
                        <option value="inquiry">❓ General Information & Inquiries</option>
                        <option value="complaint">⚠️ Complaint / Report Issue</option>
                        <option value="bug">🐞 Technical Bug / Camera or Audio</option>
                        <option value="other">💼 Other Inquiries</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Your Email</label>
                      <input
                        type="email"
                        required
                        placeholder="yourname@example.com"
                        value={feedbackEmail}
                        onChange={e => setFeedbackEmail(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Subject / Short Summary</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Question about video quality / Camera tip"
                        value={feedbackSubject}
                        onChange={e => setFeedbackSubject(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Message Details</label>
                      <textarea
                        required
                        rows="4"
                        placeholder="Type your message, suggestion, or complaint..."
                        value={feedbackMessage}
                        onChange={e => setFeedbackMessage(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div className="space-y-2 pt-1">
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setShowFeedbackModal(false)}
                          className="w-24 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold text-xs"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          disabled={feedbackLoading}
                          className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg shadow-rose-600/30 transition text-xs flex items-center justify-center gap-1.5 disabled:opacity-50"
                        >
                          {feedbackLoading ? (
                            <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                          ) : (
                            <>
                              <span>📨</span>
                              <span>Submit Ticket</span>
                            </>
                          )}
                        </button>
                      </div>

                      <div className="flex gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => openDirectGmail()}
                          className="flex-1 py-2 px-3 bg-slate-900 hover:bg-slate-750 text-rose-300 border border-rose-500/40 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition"
                        >
                          <span>📬</span>
                          <span>Compose in Gmail Web ↗</span>
                        </button>
                        <button
                          type="button"
                          onClick={copySupportEmail}
                          className="py-2 px-3 bg-slate-900 hover:bg-slate-750 text-slate-300 border border-slate-700 rounded-xl text-xs font-semibold transition"
                        >
                          {copyEmailSuccess ? '✓ Copied' : '📋 Copy'}
                        </button>
                      </div>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ================= IN-APP MESSAGES & INBOX VIEWER ================= */}
          {showAdminInboxModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 my-8">
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📬</span>
                    <h3 className="font-bold text-white text-base">In-App Received Messages ({inboxMessages.length})</h3>
                  </div>
                  <button
                    onClick={() => setShowAdminInboxModal(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg text-lg"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-xs text-slate-300">
                  All inquiries, complaints, and feedback submitted on the website are recorded here and mirrored to <span className="text-rose-400 font-bold">rafikimeetinfo@gmail.com</span>.
                </p>

                {inboxMessages.length === 0 ? (
                  <div className="p-8 text-center text-slate-400 text-xs">
                    No submitted messages yet. When users submit feedback or complaints, they will appear here.
                  </div>
                ) : (
                  <div className="space-y-3 max-h-96 overflow-y-auto pr-1">
                    {inboxMessages.map(item => (
                      <div key={item.id} className="p-3.5 rounded-2xl bg-slate-900 border border-slate-700/80 space-y-1.5 text-xs">
                        <div className="flex justify-between items-start gap-2">
                          <div>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 uppercase">
                              {item.category}
                            </span>
                            <span className="text-white font-bold ml-2">{item.subject}</span>
                          </div>
                          <span className="text-[10px] text-slate-400 flex-shrink-0">{item.createdAt}</span>
                        </div>
                        <p className="text-slate-300 text-xs bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 whitespace-pre-wrap">
                          {item.message}
                        </p>
                        <div className="flex items-center justify-between pt-1 border-t border-slate-800 text-[11px] text-slate-400">
                          <span>From: <strong className="text-slate-200">{item.senderEmail}</strong> ({item.senderUsername})</span>
                          <a
                            href={`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(item.senderEmail)}&su=${encodeURIComponent('Re: ' + item.subject)}&body=${encodeURIComponent('\n\n--- Original Message from ' + item.senderUsername + ' ---\n' + item.message)}`}
                            target="_blank"
                            rel="noreferrer"
                            className="px-2 py-0.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded border border-rose-500/30 text-[10px] font-bold transition flex items-center gap-1"
                          >
                            <span>↩️</span>
                            <span>Reply via Gmail</span>
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div className="flex gap-2 pt-2 border-t border-slate-700/60">
                  <button
                    onClick={() => {
                      localStorage.removeItem('rafiki_inbox_messages');
                      setInboxMessages([]);
                    }}
                    className="py-2 px-3 bg-slate-900 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded-xl text-xs font-semibold border border-slate-700"
                  >
                    Clear History
                  </button>
                  <button
                    onClick={() => setShowAdminInboxModal(false)}
                    className="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold"
                  >
                    Close Inbox
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= SUPABASE CONNECTION MODAL ================= */}
          {showSupabaseModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">Connect Supabase</h3>
                  <button onClick={() => setShowSupabaseModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-slate-300">
                  Connect your live Supabase database for persistent accounts, real-time messaging, and media storage.
                </p>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Supabase Project URL</label>
                    <input
                      type="text"
                      placeholder="https://your-project-id.supabase.co"
                      value={supabaseUrl}
                      onChange={e => setSupabaseUrl(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Supabase Anon Key</label>
                    <input
                      type="text"
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      value={supabaseKey}
                      onChange={e => setSupabaseKey(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      localStorage.removeItem('mf_supabase_url');
                      localStorage.removeItem('mf_supabase_key');
                      setSupabaseUrl('');
                      setSupabaseKey('');
                      setSupabaseClient(null);
                      setShowSupabaseModal(false);
                    }}
                    className="flex-1 py-2 rounded-xl bg-slate-700 text-slate-300 text-xs font-semibold"
                  >
                    Reset to Local
                  </button>

                  <button
                    onClick={() => {
                      localStorage.setItem('mf_supabase_url', supabaseUrl.trim());
                      localStorage.setItem('mf_supabase_key', supabaseKey.trim());
                      if (window.supabase && supabaseUrl && supabaseKey) {
                        try {
                          const client = window.supabase.createClient(supabaseUrl.trim(), supabaseKey.trim());
                          setSupabaseClient(client);
                        } catch (e) {}
                      }
                      setShowSupabaseModal(false);
                    }}
                    className="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-lg"
                  >
                    Save & Connect
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= LIGHTBOX IMAGE VIEW ================= */}
          {lightboxImage && (
            <div onClick={() => setLightboxImage(null)} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 cursor-pointer">
              <img src={lightboxImage} className="max-w-full max-h-[90vh] rounded-2xl object-contain shadow-2xl" />
            </div>
          )}

          {/* ================= UNIFIED BOTTOM NAVIGATION DOCK (ALL SCREENS) ================= */}
          <nav className={`fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 z-40 select-none shadow-2xl safe-pb ${currentTab === "chat" && activeChatUser ? "hidden md:block" : "block"}`}>
            <div className="max-w-2xl w-full mx-auto flex items-center justify-around py-1.5 sm:py-2.5 px-2">
              {[
                { id: 'discover', label: 'Discover', icon: '🔍' },
                { id: 'chat', label: 'Messages', icon: '💬', badge: unreadCount > 0 ? unreadCount : null },
                { id: 'video', label: 'Live Video', icon: '📹' },
                { id: 'saved', label: 'Saved', icon: '❤️', badge: savedIds.length > 0 ? savedIds.length : null },
                { id: 'account', label: currentUser ? 'Account' : 'Log In', icon: '👤' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => {
                    if (tab.id === 'chat') setUnreadCount(0);
                    setCurrentTab(tab.id);
                  }}
                  className={`flex flex-col items-center gap-1 px-3 py-1.5 rounded-2xl transition duration-200 relative ${
                    currentTab === tab.id
                      ? 'text-rose-500 font-bold bg-rose-500/15 scale-105'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                  }`}
                >
                  <span className="text-xl sm:text-2xl relative">
                    {tab.icon}
                    {tab.badge && (
                      <span className="absolute -top-1 -right-2.5 bg-rose-600 text-white text-[9px] font-black px-1.5 py-0.2 rounded-full border border-slate-900 shadow">
                        {tab.badge}
                      </span>
                    )}
                  </span>
                  <span className="text-[10px] sm:text-xs font-semibold">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RafikiMeetApp />);
  </script>
</body>
</html>
