              {/* Status indicator */}
              <div className="flex items-center gap-2">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>{Math.max(onlinePresenceKeys.size, 1)} Online</span>
                </div>
              </div>
            </header>

            {/* Main Auth Hero Form Container */}
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6 z-10 my-4 sm:my-8">
              <div className="bg-slate-900/95 border border-slate-800/90 w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl space-y-5">
                {/* Brand Hero Emblem */}
                <div className="text-center pb-1">
                  <img src={BRAND_LOGO} alt="RafikiMeet Logo" className="w-16 h-16 rounded-3xl object-cover mx-auto mb-2 shadow-2xl shadow-rose-950/60 border border-rose-500/30 hover:scale-105 transition" />
                  <h2 className="text-xl sm:text-2xl font-black text-white tracking-tight">Rafiki<span className="text-rose-500">Meet</span></h2>
                  <p className="text-xs text-slate-400 mt-0.5 font-medium">Real Friends • Real Conversations • Live Video</p>
                </div>

                {/* Mode Switcher Tabs */}
                {authMode !== 'forgot' && authMode !== 'enter_code' && (
                  <div className="flex p-1 bg-slate-950 rounded-2xl border border-slate-800">
                    <button
                      type="button"
                      onClick={() => { setAuthMode('signin'); setAuthError(''); setAuthNotice(''); }}
                      className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-1.5 ${
                        authMode === 'signin' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      <span>🔑</span>
                      <span>Log In</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthNotice(''); }}
                      className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-1.5 ${
                        authMode === 'signup' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      <span>✨</span>
                      <span>Create Account (New User)</span>
                    </button>
                  </div>
                )}

                {/* Card Title & Description */}
                <div className="text-center space-y-1">
                  <h2 className="text-xl sm:text-2xl font-extrabold text-white">
                    {authMode === 'signin' && 'Welcome Back'}
                    {authMode === 'signup' && 'Create Your 18+ Account'}
                    {authMode === 'forgot' && 'Login with Email Code'}
                    {authMode === 'enter_code' && 'Enter Verification Code'}
                  </h2>
                  <p className="text-xs text-slate-400">
                    {authMode === 'signin' && 'Log in to connect with friends and start chatting.'}
                    {authMode === 'signup' && 'Join verified adult members for real chats & live video.'}
                    {authMode === 'forgot' && 'Forgot password? We will send a login code to your email.'}
                    {authMode === 'enter_code' && 'Enter the 6-digit code sent to your email to open the site.'}
                  </p>
                </div>

                {/* Feedback notices & errors */}
                {authNotice && (
                  <div className="p-3 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs flex items-center gap-2">
                    <span>ℹ️</span>
                    <span>{authNotice}</span>
                  </div>
                )}
                {authError && (
                  <div className="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2">
                    <span>⚠️</span>
                    <span>{authError}</span>
                  </div>
                )}
                {authSuccessMessage && (
                  <div className="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs flex items-center gap-2">
                    <span>✓</span>
                    <span>{authSuccessMessage}</span>
                  </div>
                )}

                {/* SIGN IN FORM */}
                {authMode === 'signin' && (
                  <form onSubmit={handleSignIn} className="space-y-3.5 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="e.g. kelvinkirui1528@gmail.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition"
                      />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-slate-400 font-semibold">Password</label>
                        <button
                          type="button"
                          onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthNotice(''); }}
                          className="text-[11px] text-rose-400 hover:underline"
                        >
                          Forgot password?
                        </button>
                      </div>
                      <input
                        type="password"
                        required
                        placeholder="Enter your password"
                        value={authPassword}
                        onChange={e => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {authLoading ? (
                        <span className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <>
                          <span>🔑</span>
                          <span>Log In & Enter RafikiMeet</span>
                        </>
                      )}
                    </button>

                    <div className="pt-2 text-center text-xs text-slate-400">
                      New to RafikiMeet?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthNotice(''); }}
                        className="text-rose-400 font-bold hover:underline"
                      >
                        Create an account
                      </button>
                    </div>
                  </form>
                )}

                {/* SIGN UP FORM */}
                {authMode === 'signup' && (
                  <form onSubmit={handleSignUp} className="space-y-3 text-xs">
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Display Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Kelvin K."
                          value={authDisplayName}
                          onChange={e => setAuthDisplayName(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Username</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. kelvin_254"
                          value={authUsername}
                          onChange={e => setAuthUsername(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, ''))}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="e.g. yourname@gmail.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Password (min 6 characters)</label>
                      <input
                        type="password"
                        required
                        minLength="6"
                        placeholder="Create a secure password"
                        value={authPassword}
                        onChange={e => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Age (Must be 18+)</label>
                        <input
                          type="number"
                          min="18"
                          max="99"
                          required
                          value={authAge}
                          onChange={e => setAuthAge(Number(e.target.value))}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">Gender</label>
                        <select
                          value={authGender}
                          onChange={e => setAuthGender(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500"
                        >
                          <option value="female">Female</option>
                          <option value="male">Male</option>
                          <option value="non-binary">Non-binary</option>
                          <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                      </div>
                    </div>

                    {/* Strict 18+ Verification & Terms Checkboxes */}
                    <div className="space-y-2 pt-1">
                      <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded-xl bg-slate-950 border border-rose-500/30">
                        <input
                          type="checkbox"
                          required
                          checked={auth18PlusConfirmed}
                          onChange={e => setAuth18PlusConfirmed(e.target.checked)}
                          className="mt-0.5 w-4 h-4 rounded text-rose-600 focus:ring-rose-500"
                        />
                        <span className="text-[11px] text-rose-300 font-semibold leading-tight">
                          🔞 I confirm that I am at least 18 years old. I understand RafikiMeet is strictly for adults (18+).
                        </span>
                      </label>

                      <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                        <input
                          type="checkbox"
                          required
                          checked={authTermsConfirmed}
                          onChange={e => setAuthTermsConfirmed(e.target.checked)}
                          className="mt-0.5 w-4 h-4 rounded text-rose-600 focus:ring-rose-500"
                        />
                        <span className="text-[11px] text-slate-300 leading-tight">
                          📜 I agree to the Community Safety Guidelines and Safe Friendship Code.
                        </span>
                      </label>
                    </div>

                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {authLoading ? (
                        <span className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <>
                          <span>✨</span>
                          <span>Create 18+ Account & Enter</span>
                        </>
                      )}
                    </button>

                    <div className="pt-2 text-center text-xs text-slate-400">
                      Already have an account?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthMode('signin'); setAuthError(''); setAuthNotice(''); }}
                        className="text-rose-400 font-bold hover:underline"
                      >
                        Log In here
                      </button>
                    </div>
                  </form>
                )}

                {/* 1. FORGOT PASSWORD / REQUEST LOGIN CODE FORM */}
                {authMode === 'forgot' && (
                  <form onSubmit={handleSendLoginCode} className="space-y-3.5 text-xs">
                    <p className="text-slate-300 text-xs leading-relaxed">
                      Forgot your password? Enter your registered email address and we will immediately send a <strong>6-digit verification code</strong> to your inbox to log you in.
                    </p>
                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Registered Email Address</label>
                      <input
                        type="email"
                        required
                        placeholder="e.g. kelvinkirui1528@gmail.com"
                        value={authEmail}
                        onChange={e => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('signin'); setAuthError(''); setAuthNotice(''); }}
                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition"
                      >
                        Back to Log In
                      </button>
                      <button
                        type="submit"
                        disabled={authLoading}
                        className="flex-1 py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold text-xs shadow-lg shadow-rose-600/30 transition flex items-center justify-center gap-1.5 disabled:opacity-50"
                      >
                        {authLoading ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                        ) : (
                          <>
                            <span>📧</span>
                            <span>Send Code to Email</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                )}

                {/* 2. ENTER CODE & OPEN SITE FORM */}
                {authMode === 'enter_code' && (
                  <form onSubmit={handleVerifyCode} className="space-y-4 text-xs">
                    <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800 text-center space-y-1">
                      <p className="text-slate-300 text-xs">
                        We sent a 6-digit login code to:
                      </p>
                      <p className="font-bold text-rose-400 text-xs truncate">{authEmail}</p>
                      <p className="text-[11px] text-slate-500">Please check your Inbox and Spam folder.</p>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1.5 font-semibold text-center uppercase tracking-wider text-[11px]">
                        Enter 6-Digit Code
                      </label>
                      <input
                        type="text"
                        required
                        autoFocus
                        maxLength="8"
                        placeholder="123456"
                        value={authOtpCode}
                        onChange={e => setAuthOtpCode(e.target.value.replace(/[^a-zA-Z0-9]/g, ''))}
                        className="w-full bg-slate-950 border-2 border-rose-500/50 rounded-2xl p-3.5 text-center font-mono text-2xl font-bold tracking-widest text-white placeholder-slate-700 focus:outline-none focus:border-rose-500 shadow-inner"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={authLoading || !authOtpCode.trim()}
                      className="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {authLoading ? (
                        <span className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <>
                          <span>🚀</span>
                          <span>Verify Code & Open Site</span>
                        </>
                      )}
                    </button>

                    <div className="flex justify-between items-center text-xs pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('signin'); setAuthError(''); setAuthNotice(''); }}
                        className="text-slate-400 hover:text-white"
                      >
                        ← Back to Log In
                      </button>
                      <button
                        type="button"
                        disabled={otpCountdown > 0 || authLoading}
                        onClick={handleSendLoginCode}
                        className="text-rose-400 hover:underline font-semibold disabled:text-slate-500 disabled:no-underline"
                      >
                        {otpCountdown > 0 ? `Resend code in ${otpCountdown}s` : '📧 Resend Code'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </main>

            {/* Landing Footer */}
            <footer className="px-6 py-4 border-t border-slate-900 bg-slate-950 text-center text-xs text-slate-500 z-10">
              <p>RafikiMeet is strictly for adults (18+). Zero tolerance for harassment or unlawful content.</p>
              <p className="text-[11px] text-slate-600 mt-1">Support: rafikimeetinfo@gmail.com • Kenya Emergency: 999 / 112</p>
            </footer>

            {/* Password Recovery Modal (if opening recovery link from email) */}
            {showRecoveryModal && (
              <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-slate-800 border border-rose-500/40 w-full max-w-md rounded-3xl p-6 sm:p-7 shadow-2xl space-y-4">
                  <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">🔐</span>
                      <h3 className="font-bold text-white text-base">Reset Your Password</h3>
                    </div>
                    <button
                      onClick={() => setShowRecoveryModal(false)}
                      className="text-slate-400 hover:text-white p-1 rounded-lg text-lg"
                    >
                      ✕
                    </button>
                  </div>

                  <p className="text-xs text-slate-300">
                    You verified your account via the email link! Please enter a new secure password for your account.
                  </p>

                  {recoverySuccess ? (
                    <div className="p-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-center space-y-2">
                      <div className="text-3xl">✓</div>
                      <h4 className="font-bold text-emerald-400 text-sm">Password Updated Successfully!</h4>
                      <p className="text-xs text-slate-300">You are now logged in with your new password.</p>
                    </div>
                  ) : (
                    <form onSubmit={handleSetNewPassword} className="space-y-3.5 text-xs">
                      {recoveryError && (
                        <div className="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs">
                          ⚠️ {recoveryError}
                        </div>
                      )}
                      <div>
                        <label className="block text-slate-400 mb-1 font-semibold">New Password (min 6 characters)</label>
                        <input
                          type="password"
                          required
                          minLength="6"
                          placeholder="Enter your new password"
                          value={recoveryNewPassword}
                          onChange={e => setRecoveryNewPassword(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <button
                        type="submit"
                        disabled={recoveryLoading}
                        className="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition text-xs flex items-center justify-center gap-2 disabled:opacity-50"
                      >
                        {recoveryLoading ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                        ) : (
                          <span>Save New Password & Log In</span>
                        )}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }


      return (
        <div className="flex flex-col h-screen h-[100dvh] w-screen max-w-full bg-slate-900 text-slate-100 overflow-hidden font-sans">
          
          {/* TOP APP HEADER */}
          <header className="flex items-center justify-between px-4 sm:px-6 py-3 bg-slate-900 border-b border-slate-800 z-30 select-none">
            {/* Brand */}
            <div onClick={() => setCurrentTab('discover')} className="flex items-center gap-2.5 cursor-pointer group">
              <img src={BRAND_LOGO} alt="RafikiMeet Logo" className="w-10 h-10 rounded-2xl object-cover shadow-lg shadow-rose-500/25 group-hover:scale-105 transition border border-rose-500/30" />
              <div>
                <div className="flex items-center gap-1.5">
                  <span className="font-extrabold text-lg text-white tracking-tight">Rafiki<span className="text-rose-500">Meet</span></span>
                  <span className="text-[10px] font-black px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/40">18+</span>
                </div>
                <p className="text-[10px] text-slate-400 font-medium">Meet People • Make Friends</p>
              </div>
            </div>

            {/* Right Action Controls: Audio FX toggle, Supabase Pill & Profile */}
            <div className="flex items-center gap-2">
              <div className="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-[11px] text-slate-300">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{profiles.filter(p => isUserTrulyOnline(p)).length + (currentUser && currentUser.showOnlineStatus !== false ? 1 : 0)} Online</span>
              </div>

              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                className={`p-2 rounded-xl border text-xs transition ${
                  soundEnabled ? 'bg-slate-800 text-rose-400 border-slate-700' : 'bg-slate-800 text-slate-500 border-slate-700'
                }`}
                title={soundEnabled ? 'Sound Effects Enabled (Click to Mute)' : 'Sound Effects Muted (Click to Enable)'}
              >
                {soundEnabled ? '🔔' : '🔕'}
              </button>

              <button
                onClick={() => setShowSupabaseModal(true)}
                className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 border transition ${
                  supabaseClient
                    ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/40'
                    : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-rose-500'
                }`}
                title="Configure Supabase Database & Realtime"
              >
                <span className={`w-2 h-2 rounded-full ${supabaseClient ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`} />
                <span className="hidden sm:inline">{supabaseClient ? 'Supabase Live' : 'Link Supabase'}</span>
              </button>

              {currentUser ? (
                <div className="flex items-center gap-2">
                  <div 
                    onClick={() => setCurrentTab('account')}
                    className="flex items-center gap-2 cursor-pointer hover:bg-slate-800 p-1.5 rounded-xl transition"
                    title="View Profile"
                  >
                    <img src={currentUser.avatarUrl} className="w-8 h-8 rounded-full object-cover border border-rose-500/40" />
                    <span className="hidden lg:inline text-xs font-semibold text-white">@{currentUser.username}</span>
                  </div>
                  <button
                    onClick={handleSignOut}
                    className="hidden sm:flex px-2.5 py-1.5 bg-slate-800 hover:bg-rose-950/60 hover:text-rose-400 border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 transition items-center gap-1"
                    title="Log Out"
                  >
                    <span>🚪</span>
                    <span>Log Out</span>
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => { setAuthMode('signin'); setAuthNotice(''); setAuthError(''); setShowAuthModal(true); }}
                  className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow-md shadow-rose-600/30 flex items-center gap-1.5 transition"
                >
                  <span>🔑</span>
                  <span>Log In</span>
                </button>
              )}
            </div>
          </header>

          {/* MAIN VIEW CONTAINER */}
          <main className="flex-1 flex flex-col overflow-hidden pb-20">

            {/* ================= 1. DISCOVER TAB ================= */}
            {currentTab === 'discover' && (
              <div className="flex-1 flex flex-col h-full bg-slate-900 overflow-y-auto pb-28 sm:pb-32">
                {/* Taglines Hero Banner */}
                <div className="bg-gradient-to-r from-rose-950/40 via-slate-900 to-slate-900 border-b border-slate-800/80 px-4 py-2.5">
                  <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between text-xs text-slate-300 gap-1 text-center sm:text-left">
                    <p className="font-semibold text-rose-300">
                      ✨ Meet people. Make friends. <span className="text-slate-400 font-normal hidden md:inline">— Your next friend is closer than you think.</span>
                    </p>
                    <p className="text-[11px] text-slate-400">Adults 18+ • Private Chat • Live Video • Nothing to Install</p>
                  </div>
                </div>

                {/* Search & Filter Header */}
                <div className="sticky top-0 z-20 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 p-3 sm:p-4">
                  <div className="max-w-6xl mx-auto flex items-center gap-2.5">
                    <div className="relative flex-1">
                      <input
                        type="text"
                        placeholder="Search by @username, interests, or bio..."
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:border-rose-500 transition"
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
                          ✕
                        </button>
                      )}
                    </div>

                    <button
                      onClick={() => setShowFilterDrawer(!showFilterDrawer)}
                      className={`px-3.5 py-2.5 rounded-xl border text-xs font-bold transition flex items-center gap-1.5 ${
                        showFilterDrawer ? 'bg-rose-500/20 text-rose-400 border-rose-500/40' : 'bg-slate-800 text-slate-300 border-slate-700'
                      }`}
                    >
                      <span>⚙️ Filters</span>
                    </button>
                  </div>

                  {/* Filter Expandable Panel */}
                  {showFilterDrawer && (
                    <div className="max-w-6xl mx-auto mt-3 p-4 bg-slate-800/90 border border-slate-700 rounded-2xl space-y-3.5 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-slate-400 font-semibold mb-1">Gender</label>
                          <select
                            value={filterGender}
                            onChange={e => setFilterGender(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"
                          >
                            <option value="all">Everyone</option>
                            <option value="female">Women</option>
                            <option value="male">Men</option>
                            <option value="non-binary">Non-binary</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-slate-400 font-semibold mb-1">
                            Age Range: {filterMinAge} – {filterMaxAge}
                          </label>
                          <div className="flex gap-2 items-center">
                            <input
                              type="range" min="18" max="65" value={filterMinAge}
                              onChange={e => setFilterMinAge(Number(e.target.value))}
                              className="w-full accent-rose-500"
                            />
                            <input
                              type="range" min="18" max="75" value={filterMaxAge}
                              onChange={e => setFilterMaxAge(Number(e.target.value))}
                              className="w-full accent-rose-500"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-slate-400 font-semibold mb-1">
                            Max Distance: {filterMaxDistance >= 100 ? 'Any distance' : `Within ${filterMaxDistance} km`}
                          </label>
                          <input
                            type="range" min="5" max="100" step="5" value={filterMaxDistance}
                            onChange={e => setFilterMaxDistance(Number(e.target.value))}
                            className="w-full accent-rose-500"
                          />
                        </div>
                      </div>

                      <div className="flex items-center justify-between pt-1 border-t border-slate-700">
                        <label className="flex items-center gap-2 cursor-pointer text-slate-300">
                          <input
                            type="checkbox"
                            checked={filterOnlineOnly}
                            onChange={e => setFilterOnlineOnly(e.target.checked)}
                            className="rounded text-rose-600"
                          />
                          Show online members only
                        </label>

                        <button
                          onClick={() => {
                            setFilterGender('all');
                            setFilterMinAge(18);
                            setFilterMaxAge(65);
                            setFilterMaxDistance(100);
                            setFilterOnlineOnly(false);
                            setSelectedInterests([]);
                          }}
                          className="text-rose-400 hover:underline font-semibold"
                        >
                          Reset Filters
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* Profiles Grid */}
                <div className="max-w-6xl mx-auto p-4 sm:p-6 w-full flex-1">
                  {filteredProfiles.length === 0 ? (
                    <div className="text-center py-20 bg-slate-800/40 rounded-3xl border border-slate-800 p-8 max-w-md mx-auto">
                      <div className="text-4xl mb-3">👋</div>
                      <h3 className="font-bold text-white text-lg mb-1">Welcome to RafikiMeet!</h3>
                      <p className="text-xs text-slate-300 max-w-sm mx-auto mb-5 leading-relaxed">
                        {profiles.length === 0
                          ? "You are among the first members! Share your link with friends or wait for new verified 18+ members to register."
                          : "No profiles match your current search or filters. Try clearing your filters."}
                      </p>
                      <button
                        onClick={() => {
                          if (navigator.share) {
                            navigator.share({ title: 'RafikiMeet', text: 'Join me on RafikiMeet - Adult 18+ friendly chat & live video!', url: window.location.href });
                          } else {
                            navigator.clipboard.writeText(window.location.href);
                            alert('RafikiMeet link copied! Share it on WhatsApp to invite friends.');
                          }
                        }}
                        className="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-rose-600/30 transition inline-flex items-center gap-1.5"
                      >
                        <span>🔗</span>
                        <span>Share Invite Link</span>
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                      {filteredProfiles.map(profile => {
                        const isSaved = savedIds.includes(profile.id);
                        const commonInterests = (currentUser && currentUser.interests) ? profile.interests.filter(i => currentUser.interests.includes(i)) : [];

                        return (
                          <div key={profile.id} className="bg-slate-800/90 border border-slate-700 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between group">
                            {/* Photo & Distance banner */}
                            <div className="relative h-64 sm:h-72 w-full bg-slate-950 overflow-hidden">
                              <img src={profile.avatarUrl} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                              <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent" />

                              {/* Online badge */}
                              {isUserTrulyOnline(profile) && profile.showOnlineStatus && (
                                <div className="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-emerald-500/30 text-[11px] font-semibold text-emerald-400">
                                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" /> Online
                                </div>
                              )}

                              {/* Save Bookmark button */}
                              <button
                                onClick={() => toggleSaveUser(profile.id)}
                                className={`absolute top-3 right-3 p-2.5 rounded-full backdrop-blur-md transition ${
                                  isSaved ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' : 'bg-black/50 text-white hover:bg-black/80'
                                }`}
                                title={isSaved ? 'Remove from Saved' : 'Save Profile'}
                              >
                                ❤️
                              </button>

                              {/* Privacy-Preserved Approximate Distance Pill */}
                              {profile.distanceKm !== undefined && (
                                <div className="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs text-white border border-white/10 flex items-center gap-1">
                                  <span>📍</span> About {Math.round(profile.distanceKm)} km away
                                </div>
                              )}
                            </div>

                            {/* Bio & Details */}
                            <div className="p-4 sm:p-5 flex-1 flex flex-col justify-between">
                              <div>
                                <div className="flex items-baseline justify-between mb-1.5">
                                  <h3 className="font-bold text-lg text-white">
                                    @{profile.username}, <span className="text-slate-400 font-normal">{profile.age}</span>
                                  </h3>
                                  <span className="text-xs text-slate-400 capitalize">{profile.gender}</span>
                                </div>

                                {/* Common Interests Match Indicator */}
                                {commonInterests.length > 0 && (
                                  <div className="text-[11px] font-bold text-rose-400 bg-rose-500/10 border border-rose-500/25 px-2.5 py-1 rounded-full inline-flex items-center gap-1.5 mb-2">
                                    <span>🔥</span> {commonInterests.length} in common: {commonInterests.slice(0, 3).join(', ')}
                                  </div>
                                )}

                                <p className="text-xs text-slate-300 line-clamp-3 mb-3 leading-relaxed">
                                  {profile.bio}
                                </p>

                                <div className="flex flex-wrap gap-1.5 mb-4">
                                  {profile.interests.map(t => (
                                    <span key={t} className="text-[10px] px-2.5 py-0.5 rounded-full bg-slate-700/60 text-slate-300 border border-slate-700 font-medium">
                                      {t}
                                    </span>
                                  ))}
                                </div>
                              </div>

                              {/* Action Buttons */}
                              <div className="flex items-center gap-2 pt-2 border-t border-slate-700/70">
                                <button
                                  onClick={() => {
                                    if (!currentUser) {
                                      setAuthNotice('Please sign in or create an account to start private messaging.');
                                      setAuthMode('signin');
                                      setShowAuthModal(true);
                                      return;
                                    }
                                    setActiveChatUser(profile);
                                    setCurrentTab('chat');
                                  }}
                                  className="flex-1 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition"
                                >
                                  💬 Message
                                </button>
                                <button
                                  onClick={() => {
                                    if (!currentUser) {
                                      setAuthNotice('Please sign in or create an account to start video calls.');
                                      setAuthMode('signin');
                                      setShowAuthModal(true);
                                      return;
                                    }
                                    startVideoCall(profile);
                                  }}
                                  className="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition shadow-lg shadow-rose-600/30"
                                >
                                  📹 Call
                                </button>
                                <button
                                  onClick={() => setReportTargetUser(profile)}
                                  className="p-2 rounded-xl bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 border border-slate-700 transition"
                                  title="Report or Block"
                                >
                                  🛡️
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ================= 2. CHAT TAB ================= */}
            {currentTab === 'chat' && (
              <div className="flex-1 flex h-full max-w-6xl mx-auto w-full bg-slate-950/60 border-x border-slate-800 overflow-hidden">
                {/* Conversations Sidebar */}
                <div className={`w-full md:w-80 lg:w-96 border-r border-slate-800 bg-slate-900 flex flex-col ${activeChatUser ? 'hidden md:flex' : 'flex'}`}>
                  <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                    <h2 className="text-lg font-bold text-white">Direct Messages</h2>
                    <span className="text-xs text-rose-400 font-semibold">
                      {sortedChatProfiles.length} members
                    </span>
                  </div>

                  <div className="flex-1 overflow-y-auto divide-y divide-slate-800/60 pb-28 md:pb-4">
                    {sortedChatProfiles.map(p => {
                      const isSelected = activeChatUser?.id === p.id || (activeChatUser?.username && String(activeChatUser.username).toLowerCase() === String(p.username || '').toLowerCase());
                      const userMsgs = chatMessages[p.id] || chatMessages[p.username] || [];
                      const lastMsg = userMsgs[userMsgs.length - 1];

                      return (
                        <div
                          key={p.id}
                          onClick={() => {
                            setActiveChatUser(p);
                            loadAllUserMessages();
                          }}
                          className={`p-3.5 flex items-center gap-3 cursor-pointer transition ${
                            isSelected ? 'bg-slate-800/90 border-l-4 border-rose-500' : 'hover:bg-slate-800/40'
                          }`}
                        >
                          <div className="relative">
                            <img src={p.avatarUrl} className="w-12 h-12 rounded-full object-cover border border-slate-700" />
                            {isUserTrulyOnline(p) && p.showOnlineStatus && (
                              <span className="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-slate-900" />
                            )}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex justify-between items-baseline mb-0.5">
                              <h4 className="font-bold text-xs sm:text-sm text-white truncate">@{p.username}</h4>
                              {lastMsg && <span className="text-[10px] text-slate-400">{lastMsg.createdAt}</span>}
                            </div>
                            <p className="text-xs text-slate-400 truncate">
                              {lastMsg ? (lastMsg.audioUrl ? '🎙️ Voice note' : (lastMsg.mediaUrl ? '📷 Photo' : lastMsg.text)) : 'Say hello! 👋'}
                            </p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Conversation Body */}
                {activeChatUser ? (
                  <div className="w-full max-w-full min-w-0 flex-1 flex flex-col h-full bg-slate-900/40 overflow-hidden">
                    {/* Chat Header */}
                    <div className="w-full max-w-full min-w-0 p-2.5 sm:p-3.5 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between gap-2 overflow-hidden">
                      <div className="flex items-center gap-3">
                        <button onClick={() => setActiveChatUser(null)} className="md:hidden p-1.5 text-slate-400 hover:text-white">
                          ⬅️
                        </button>
                        <img src={activeChatUser.avatarUrl} className="w-10 h-10 rounded-full object-cover border border-slate-700" />
                        <div>
                          <h3 className="font-bold text-sm text-white">@{activeChatUser.username}</h3>
                          <p className="text-xs text-slate-400">
                            {isUserTrulyOnline(activeChatUser) ? '🟢 Online now' : 'Active recently'}
                            {activeChatUser.distanceKm && ` • ~${Math.round(activeChatUser.distanceKm)} km away`}
                          </p>
                        </div>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => startVideoCall(activeChatUser)}
                          className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-rose-600/30"
                        >
                          <span>📹</span> Call Video
                        </button>
                        <button
                          onClick={() => setReportTargetUser(activeChatUser)}
                          className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-rose-400"
                        >
                          🛡️
                        </button>
                      </div>
                    </div>

                    {/* Quick Icebreaker Suggestions */}
                    <div className="w-full max-w-full min-w-0 px-3 py-1.5 bg-slate-900/80 border-b border-slate-800 flex items-center gap-1.5 overflow-x-auto">
                      <span className="text-[10px] text-slate-400 font-bold whitespace-nowrap">Icebreakers:</span>
                      {QUICK_ICEBREAKERS.map((text, idx) => (
                        <button
                          key={idx}
                          onClick={() => sendMessage(text)}
                          className="text-[11px] px-2.5 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white whitespace-nowrap border border-slate-700/60 transition"
                        >
                          {text}
                        </button>
                      ))}
                    </div>

                    {/* Messages stream */}
                    <div className="w-full max-w-full min-w-0 flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4 space-y-3">
                      {(((chatMessages[activeChatUser.id] && chatMessages[activeChatUser.id].length > 0) ? chatMessages[activeChatUser.id] : (chatMessages[activeChatUser.username] || [])).length === 0) ? (
                        <div className="text-center py-12 text-slate-400 text-xs">
                          <div className="text-3xl mb-2">👋</div>
                          <p className="font-semibold text-white mb-1">Start a conversation with @{activeChatUser.username}</p>
                          <p className="text-[11px] text-slate-400">Say hello, send a photo, or start a live video call!</p>
                        </div>
                      ) : ((chatMessages[activeChatUser.id] && chatMessages[activeChatUser.id].length > 0) ? chatMessages[activeChatUser.id] : (chatMessages[activeChatUser.username] || [])).map(msg => {
                        const isSelf = currentUser ? (
                          msg.senderId === currentUser.id ||
                          String(msg.senderId).toLowerCase() === String(currentUser.username).toLowerCase() ||
                          (msg.senderUsername && String(msg.senderUsername).toLowerCase() === String(currentUser.username).toLowerCase()) ||
                          (currentUser.id && String(msg.senderId).toLowerCase() === String(currentUser.id).toLowerCase())
                        ) : false;

                        return (
                          <div key={msg.id} className={`w-full max-w-full min-w-0 flex flex-col ${isSelf ? 'items-end' : 'items-start'} my-1 px-1`}>
                            <div className={`p-2.5 sm:p-3 rounded-2xl max-w-[80%] sm:max-w-md text-xs sm:text-sm shadow-md break-words transition ${
                              isSelf ? 'bg-gradient-to-r from-rose-600 to-rose-500 text-white rounded-br-xs ml-auto shadow-rose-950/40' : 'bg-slate-800 text-slate-100 rounded-bl-xs border border-slate-700/80 mr-auto'
                            }`}>
                              {/* Photo attachment */}
                              {msg.mediaUrl && (
                                <img
                                  src={msg.mediaUrl}
                                  onClick={() => setLightboxImage(msg.mediaUrl)}
                                  className="rounded-xl mb-2 cursor-pointer max-h-60 object-cover w-full"
                                />
                              )}
                              {/* Voice note audio player */}
                              {msg.audioUrl && (
                                <div className="flex items-center gap-2 py-1">
                                  <audio src={msg.audioUrl} controls className="h-8 max-w-[220px]" />
                                  <span className="text-[10px] font-mono">{msg.audioDuration ? `${msg.audioDuration}s` : 'Voice note'}</span>
                                </div>
                              )}
                              {/* Text message */}
                              {msg.text && <p className="leading-relaxed whitespace-pre-wrap">{msg.text}</p>}

                              {/* Reactions pills */}
                              {msg.reactions && Object.keys(msg.reactions).length > 0 && (
                                <div className="flex flex-wrap gap-1 mt-1.5 pt-1 border-t border-white/10">
                                  {Object.entries(msg.reactions).map(([emoji, count]) => (
                                    <span key={emoji} className="text-[10px] bg-black/40 px-1.5 py-0.5 rounded-full">
                                      {emoji} {count > 1 ? count : ''}
                                    </span>
                                  ))}
                                </div>
                              )}
                            </div>

                            {/* Hover Reaction Bar */}
                            <div className={`opacity-0 group-hover:opacity-100 transition flex items-center gap-1 bg-slate-800 px-2 py-0.5 rounded-full border border-slate-700 shadow mt-1 ${isSelf ? 'justify-end' : 'justify-start'}`}>
                              {['❤️', '😂', '🔥', '👍'].map(emoji => (
                                <button
                                  key={emoji}
                                  onClick={() => addReaction(msg.id, emoji)}
                                  className="text-xs hover:scale-125 transition p-0.5"
                                >
                                  {emoji}
                                </button>
                              ))}
                            </div>

                            {/* Timestamp & Status */}
                            <div className={`flex items-center gap-1.5 px-1 mt-0.5 ${isSelf ? 'justify-end' : 'justify-start'}`}>
                              <span className="text-[10px] text-slate-400">{msg.createdAt}</span>
                              {isSelf && <span className="text-[10px] text-rose-400 font-bold flex items-center gap-0.5">✓✓ Sent</span>}
                            </div>
                          </div>
                        );
                      })}
                      <div ref={messagesEndRef} />
                    </div>

                    {/* Chat Input Bar */}
                    <div className="w-full max-w-full min-w-0 p-2 sm:p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-1.5 sm:gap-2 safe-pb overflow-hidden">
                      <button
                        onClick={() => { setShowPhotoModal(true); setPhotoModalMode('camera'); }}
                        className="p-2 sm:p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-rose-400 transition flex-shrink-0"
                        title="Snap or Upload Photo"
                      >
                        📷
                      </button>

                      {/* Voice Note Recorder Button */}
                      {isRecordingVoice ? (
                        <div className="min-w-0 flex-1 flex items-center justify-between bg-rose-950/60 border border-rose-500/50 rounded-xl px-3 sm:px-4 py-2 animate-pulse">
                          <div className="flex items-center gap-2 text-rose-400 text-xs font-bold truncate">
                            <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping flex-shrink-0" />
                            <span className="truncate">Recording: {voiceRecordDuration}s</span>
                          </div>
                          <div className="flex items-center gap-2 flex-shrink-0">
                            <button onClick={() => stopVoiceRecording(true)} className="text-slate-400 hover:text-white text-xs">
                              Cancel
                            </button>
                            <button onClick={() => stopVoiceRecording(false)} className="px-2.5 sm:px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-lg">
                              Send ✓
                            </button>
                          </div>
                        </div>
                      ) : (
                        <>
                          <input
                            type="text"
                            placeholder={`Message @${activeChatUser.username}...`}
                            value={inputText}
                            onChange={e => setInputText(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && sendMessage(inputText)}
                            className="min-w-0 w-0 flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:border-rose-500 transition"
                          />

                          <button
                            onClick={startVoiceRecording}
                            className="p-2 sm:p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-rose-400 transition flex-shrink-0"
                            title="Record Audio Voice Note"
                          >
                            🎙️
                          </button>

                          <button
                            onClick={() => sendMessage(inputText)}
                            disabled={!inputText.trim()}
                            className="py-2 sm:py-2.5 px-3 sm:px-4 bg-rose-600 hover:bg-rose-500 disabled:opacity-40 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-rose-600/30 flex-shrink-0"
                          >
                            Send
                          </button>
                        </>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="hidden md:flex flex-1 items-center justify-center p-8 text-center text-slate-400">
                    <div>
                      <div className="w-16 h-16 rounded-3xl bg-slate-800 text-rose-500 flex items-center justify-center text-2xl mx-auto mb-3 border border-slate-700">
                        💬
                      </div>
                      <h3 className="font-bold text-white text-base mb-1">Select a friend to message</h3>
                      <p className="text-xs text-slate-400">Send texts, photos, voice notes, or start a live video call.</p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ================= 3. LIVE VIDEO TAB ================= */}
            {currentTab === 'video' && (
              <div className="flex-1 overflow-y-auto p-4 sm:p-6 max-w-4xl mx-auto w-full space-y-6 pb-28 sm:pb-32">
                {/* Random Video Match Hero Card */}
                <div className="bg-slate-800/90 border border-slate-700 rounded-3xl p-6 sm:p-8 text-center shadow-xl relative overflow-hidden">
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-rose-400 flex items-center justify-center text-3xl text-white mx-auto mb-4 shadow-lg shadow-rose-500/30">
                    📹
                  </div>

                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                          soundEnabled
                            ? 'bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/40'
                            : 'bg-slate-700 text-slate-300'
                        }`}
                      >
                        <span>{soundEnabled ? '🔔 Mute' : '🔕 Unmute'}</span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Privacy & Settings */}
                <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-4">
                  <h4 className="font-bold text-white text-base">Privacy & Visibility</h4>

                  <label className="flex items-start gap-3 cursor-pointer p-3 rounded-2xl bg-slate-900 border border-slate-700/60">
                    <input
                      type="checkbox"
                      checked={currentUser.showOnlineStatus}
                      onChange={e => updateUserProfile({ showOnlineStatus: e.target.checked })}
                      className="mt-1 w-4 h-4 rounded text-rose-600"
                    />
                    <div>
                      <p className="text-xs font-bold text-white">Show other people when I am online</p>
                      <p className="text-[11px] text-slate-400">When turned off, others will not see your active green online status.</p>
                    </div>
                  </label>

                  <div className="p-3 rounded-2xl bg-slate-900 border border-slate-700/60 space-y-2.5">
                    <label className="flex items-start gap-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={currentUser.shareLocation}
                        onChange={e => updateUserProfile({ shareLocation: e.target.checked })}
                        className="mt-1 w-4 h-4 rounded text-rose-600"
                      />
                      <div>
                        <p className="text-xs font-bold text-white">Share approximate distance</p>
                        <p className="text-[11px] text-slate-400">Your location is rounded to ~1 km grids for privacy. Other members only see an approximate distance (e.g. "About 5 km away").</p>
                      </div>
                    </label>

                    {/* Update or Remove Location buttons */}
                    <div className="flex gap-2 pt-1 border-t border-slate-800 text-xs">
                      <button
                        onClick={() => {
                          updateUserProfile({ shareLocation: true });
                          setLocationAlert('Location updated! Rounded to ~1 km for privacy.');
                          setTimeout(() => setLocationAlert(null), 3000);
                        }}
                        className="flex-1 py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700"
                      >
                        📍 Update Location (~1 km)
                      </button>
                      <button
                        onClick={() => {
                          updateUserProfile({ shareLocation: false });
                          setLocationAlert('Approximate location removed.');
                          setTimeout(() => setLocationAlert(null), 3000);
                        }}
                        className="flex-1 py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded-lg border border-slate-700"
                      >
                        🗑️ Remove Location
                      </button>
                    </div>

                    {locationAlert && (
                      <p className="text-[11px] text-emerald-400 font-semibold pt-1">✓ {locationAlert}</p>
                    )}
                  </div>

                  {/* Browser Alerts & Notification Permission */}
                  <div className="p-3 rounded-2xl bg-slate-900 border border-slate-700/60 flex items-center justify-between gap-3">
                    <div>
                      <p className="text-xs font-bold text-white flex items-center gap-1.5">
                        <span>🔔</span>
                        <span>Live Call & Message Alerts</span>
                      </p>
                      <p className="text-[11px] text-slate-400">Receive instant ringing alerts when someone video calls or messages you.</p>
                    </div>
                    <button
                      onClick={() => {
                        if (typeof window !== 'undefined' && 'Notification' in window) {
                          Notification.requestPermission().then(perm => {
                            if (perm === 'granted') {
                              setLocationAlert('Notifications active! You will receive live alerts.');
                            } else {
                              setLocationAlert('Notifications blocked in browser settings.');
                            }
                            setTimeout(() => setLocationAlert(null), 4000);
                          });
                        }
                      }}
                      className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition whitespace-nowrap shadow-md shadow-rose-600/30"
                    >
                      Enable Alerts
                    </button>
                  </div>

                  {/* Password Management & Reset Section */}
                  <div className="pt-3 border-t border-slate-700/60 space-y-2 text-xs">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                      <div>
                        <span className="text-slate-300 font-semibold">Account Security:</span>
                        <p className="text-[11px] text-slate-400">Change your password or request a reset link to {currentUser.email}</p>
                      </div>
                      <div className="flex gap-2 w-full sm:w-auto">
                        <button
                          onClick={() => setShowChangePasswordForm(!showChangePasswordForm)}
                          className="flex-1 sm:flex-none px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold border border-slate-700 transition"
                        >
                          {showChangePasswordForm ? 'Cancel' : '🔑 Change Password'}
                        </button>
                        <button
                          onClick={handleSendResetEmailFromAccount}
                          disabled={resetEmailLoading}
                          className="flex-1 sm:flex-none px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-xl text-xs font-semibold border border-rose-500/40 transition flex items-center justify-center gap-1"
                        >
                          {resetEmailLoading ? 'Sending...' : '📧 Send Reset Link'}
                        </button>
                      </div>
                    </div>

                    {/* Status alerts */}
                    {resetEmailSent && (
                      <div className="p-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs">
                        ✓ Password reset link dispatched to <strong>{currentUser.email}</strong>. Check your Inbox and Spam folder!
                      </div>
                    )}
                    {resetEmailError && (
                      <div className="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs">
                        ⚠️ {resetEmailError}
                      </div>
                    )}
                    {passwordChangeSuccess && (
                      <div className="p-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs">
                        ✓ Your password has been changed successfully!
                      </div>
                    )}

                    {/* Inline Change Password Form */}
                    {showChangePasswordForm && (
                      <form onSubmit={handleChangePasswordDirectly} className="p-3.5 bg-slate-900 rounded-2xl border border-slate-700/80 space-y-2.5 mt-2">
                        <h5 className="font-bold text-white text-xs">Set New Password</h5>
                        {passwordChangeError && (
                          <div className="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-[11px] space-y-2">
                            <p className="font-semibold">⚠️ {passwordChangeError}</p>
                            {passwordChangeError.includes('session missing') && (
                              <button
                                type="button"
                                onClick={handleSendResetEmailFromAccount}
                                disabled={resetEmailLoading}
                                className="w-full py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-[11px] transition flex items-center justify-center gap-1"
                              >
                                {resetEmailLoading ? 'Sending...' : `📧 Send Verified Link to ${currentUser.email}`}
                              </button>
                            )}
                          </div>
                        )}
                        <div className="space-y-2">
                          <input
                            type="password"
                            required
                            minLength="6"
                            placeholder="New password (min 6 characters)"
                            value={newAccountPassword}
                            onChange={e => setNewAccountPassword(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-rose-500"
                          />
                          <input
                            type="password"
                            required
                            minLength="6"
                            placeholder="Confirm new password"
                            value={newAccountPasswordConfirm}
                            onChange={e => setNewAccountPasswordConfirm(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-rose-500"
                          />
                        </div>
                        <button
                          type="submit"
                          disabled={passwordChangeLoading}
                          className="w-full py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold text-xs shadow-md transition disabled:opacity-50"
                        >
                          {passwordChangeLoading ? 'Saving...' : 'Save New Password'}
                        </button>
                      </form>
                    )}
                  </div>
                </div>

                {/* Blocked List */}
                <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-3">
                  <h4 className="font-bold text-white text-base">Blocked People ({blockedIds.length})</h4>
                  {blockedIds.length === 0 ? (
                    <p className="text-xs text-slate-400">You haven't blocked anyone. Blocked people cannot message or video call you.</p>
                  ) : (
                    <div className="space-y-2">
                      {blockedIds.map(id => (
                        <div key={id} className="flex justify-between items-center p-2.5 bg-slate-900 rounded-xl">
                          <span className="text-xs text-slate-300">User ID: {id}</span>
                          <button onClick={() => unblockUser(id)} className="text-xs text-rose-400 hover:underline font-bold">Unblock</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Account Session & Sign Out */}
                <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-4">
                  <h4 className="font-bold text-white text-base">Account Session</h4>
                  <p className="text-xs text-slate-400">
                    Logged in as <span className="font-bold text-white">{currentUser.displayName}</span> ({currentUser.email})
                  </p>
                  <div className="flex flex-col sm:flex-row gap-3 pt-1">
                    <button
                      onClick={() => {
                        setAuthMode('signin');
                        setAuthNotice('');
                        setAuthError('');
                        setShowAuthModal(true);
                      }}
                      className="flex-1 py-2.5 px-4 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2"
                    >
                      <span>🔄</span>
                      <span>Switch Account</span>
                    </button>
                    <button
                      onClick={handleSignOut}
                      className="flex-1 py-2.5 px-4 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-lg"
                    >
                      <span>🚪</span>
                      <span>Log Out of RafikiMeet</span>
                    </button>
                  </div>
                </div>

                {/* Help, Feedback & Support Card */}
                <div className="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div>
                      <h4 className="font-bold text-white text-base flex items-center gap-2">
                        <span>💬</span>
                        <span>Need Help or Have Feedback?</span>
                      </h4>
                      <p className="text-xs text-slate-400">Questions, bug reports, and suggestions are monitored 24/7.</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setShowAdminInboxModal(true)}
                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-750 text-slate-300 rounded-xl text-xs font-bold border border-slate-700 transition flex items-center gap-1.5"
                      >
                        <span>📋</span>
                        <span>Tickets ({inboxMessages.length})</span>
                      </button>
                      <button
                        onClick={() => { setSubmittedTicket(null); setShowFeedbackModal(true); }}
                        className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-rose-600/30"
                      >
                        <span>✉️</span>
                        <span>Create Ticket</span>
                      </button>
                    </div>
                  </div>

                  <div className="p-3.5 rounded-2xl bg-slate-900 border border-slate-700/60 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs">
                    <div>
                      <p className="text-[11px] text-slate-400">Official Inquiries & Support Email:</p>
                      <p className="font-mono font-bold text-white text-xs">rafikimeetinfo@gmail.com</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={copySupportEmail}
