  <style>
    /* Mobile & Laptop Responsive Touch & Layout Engine */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    /* Device safe-area insets for iPhone notch/island and Android navigation bars */
    .safe-pb {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 16px));
    }
    .safe-pt {
      padding-top: max(0.5rem, env(safe-area-inset-top, 0px));
    }

    /* Prevent mobile browser forced zoom on input focus */
    @media screen and (max-width: 640px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="number"],
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    /* Smooth momentum touch scrolling */
    .overflow-y-auto, .overflow-x-auto {
      -webkit-overflow-scrolling: touch;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    /* Video Filters */
    .filter-warm { filter: sepia(0.2) contrast(1.1) saturate(1.2); }
    .filter-bw { filter: grayscale(1) contrast(1.2); }
    .filter-cyberpunk { filter: hue-rotate(320deg) contrast(1.15) saturate(1.4); }
    .filter-vivid { filter: saturate(1.6) contrast(1.08); }
    .filter-vintage { filter: sepia(0.4) contrast(0.95) brightness(1.05) hue-rotate(-15deg); }
    .filter-emerald { filter: hue-rotate(85deg) contrast(1.15) saturate(1.3); }
    .filter-noir { filter: grayscale(1) contrast(1.6) brightness(0.9); }
    .filter-sunset { filter: sepia(0.3) saturate(1.8) hue-rotate(330deg) brightness(1.05); }
    
    /* Hardware-Accelerated Crisp Video Rendering */
    video {
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      image-rendering: -webkit-optimize-contrast;
    }
    
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring { animation: pulseRing 2s infinite ease-in-out; }
  </style>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('RafikiMeet App Error:', msg, error);
      var errEl = document.getElementById('rafiki-error-banner');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'rafiki-error-banner';
        errEl.style = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;margin:0 auto;background:#1e1b4b;border:1px solid #f43f5e;color:#fff;padding:16px;border-radius:16px;z-index:999999;box-shadow:0 20px 40px rgba(0,0,0,0.8);font-family:sans-serif;font-size:13px;';
        errEl.innerHTML = '<div style="font-weight:bold;color:#fb7185;margin-bottom:6px;">⚠️ Notice Loading RafikiMeet</div>' +
          '<div style="color:#cbd5e1;font-size:12px;margin-bottom:12px;">' + (msg || 'Initial script load issue') + '</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button onclick="localStorage.clear();location.reload();" style="background:#f43f5e;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;">Clear Cache & Refresh</button>' +
            '<button onclick="this.parentElement.parentElement.remove()" style="background:#334155;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;">Dismiss</button>' +
          '</div>';
        document.body.appendChild(errEl);
      }
      return false;
    };
  </script>

    const SoundFX = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },
      playDing() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } catch(e) {}
      },
      playRingTone() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.frequency.value = 440;
          osc2.frequency.value = 480;
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(); osc2.start();
          osc1.stop(ctx.currentTime + 0.7);
          osc2.stop(ctx.currentTime + 0.7);
        } catch(e) {}
      },
      incomingRingtoneTimer: null,
      startIncomingRingtone() {
        this.stopIncomingRingtone();
        this.playRingTone();
        this.incomingRingtoneTimer = setInterval(() => {
          this.playRingTone();
        }, 2200);
      },
      stopIncomingRingtone() {
        if (this.incomingRingtoneTimer) {
          clearInterval(this.incomingRingtoneTimer);
          this.incomingRingtoneTimer = null;
        }
      },
      playHangup() {
        this.stopIncomingRingtone();
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.connect(gain);

          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch(e) {}
      }

    // Image resize helper
    async function resizeImage(fileOrBlob, maxWidth = 1080, maxHeight = 1080, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                maxHeight = height;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(fileOrBlob);
      });
    }

      const DARK_DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='100%25' height='100%25'><rect width='200' height='200' fill='%230b0f19'/><circle cx='100' cy='75' r='38' fill='%231e293b'/><circle cx='100' cy='75' r='33' fill='%23334155'/><path d='M35 185c0-36 29-65 65-65s65 29 65 65v10H35v-10z' fill='%231e293b'/><path d='M42 185c0-32 26-58 58-58s58 26 58 58v10H42v-10z' fill='%23334155'/></svg>";

      const isCustomAvatar = (url) => {

      const [showAuthModal, setShowAuthModal] = useState(false);

      const [authEmail, setAuthEmail] = useState('');

      const [authUsername, setAuthUsername] = useState('');
      const [authAge, setAuthAge] = useState(21);
      const [authGender, setAuthGender] = useState('female');
      const [auth18PlusConfirmed, setAuth18PlusConfirmed] = useState(false);
      const [authTermsConfirmed, setAuthTermsConfirmed] = useState(false);
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      const [authSuccessMessage, setAuthSuccessMessage] = useState('');

      // App state
      const [currentTab, setCurrentTab] = useState('discover');
      const [appTheme, setAppTheme] = useState(() => {

      const [editVibeBadge, setEditVibeBadge] = useState(currentUser?.vibeBadge || '🎧 Late-Night Talks');
      const [profiles, setProfiles] = useState(() => {

      // Fetch Real Registered Profiles from Supabase
      useEffect(() => {
        if (!supabaseClient) return;

        const loadRealProfiles = async () => {
          try {

              .from('profiles')

              }));

              // Merge Supabase profiles with local community cache so every created account is displayed

                prev.forEach(p => {
                  const key = p.username ? p.username.toLowerCase() : p.id;

                // 2. Add / update with Supabase profiles
                mapped.forEach(p => {

          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {

        return () => {

      // Automatically sync all local accounts up to Supabase cloud so phone and laptop stay 100% in sync
      useEffect(() => {
        if (!supabaseClient) return;

        const syncToCloud = async () => {
          try {
            const cached = localStorage.getItem('mf_community_profiles');
            if (cached) {
              const list = JSON.parse(cached);
              if (Array.isArray(list) && list.length > 0) {
                for (const p of list) {

                    await supabaseClient.from('profiles').upsert({
                      id: p.id || `user-${p.username}`,
                      username: p.username.toLowerCase(),
                      display_name: p.displayName || p.username,

                      gender: p.gender || 'unspecified',
                      bio: p.bio || 'Active member on RafikiMeet ready to chat!',

                      avatar_url: p.avatarUrl || '',

                  } catch (ue) {}

              }
            }
          } catch (e) {}
        };

      }, [supabaseClient]);

      // Real-time broadcast synchronization for new accounts across browser tabs
      useEffect(() => {
        let channel = null;
        try {
          channel = new BroadcastChannel('rafikimeet_community_profiles');
          channel.onmessage = (event) => {
            if (event.data?.type === 'NEW_ACCOUNT' && event.data.profile) {
              const newP = event.data.profile;
              setProfiles(prev => {
                const filtered = prev.filter(p => p.id !== newP.id && p.username.toLowerCase() !== newP.username.toLowerCase());
                const updated = [newP, ...filtered];

                } catch (e) {}

            }
          };
        } catch (e) {}
        return () => channel?.close();
      }, []);

      // Realtime channel reference & live notification states
      const realtimeChannelRef = useRef(null);
      const [incomingCall, setIncomingCall] = useState(null); // { callId, callerId, callerUsername, callerDisplayName, callerAvatar }
      const [messageNotification, setMessageNotification] = useState(null); // { senderId, senderUsername, senderAvatar, text, timestamp }
      const [unreadCount, setUnreadCount] = useState(0);
      const [onlinePresenceKeys, setOnlinePresenceKeys] = useState(() => new Set());

      // Helper to check if a user is truly live/online right now
      const isUserTrulyOnline = useCallback((p) => {
        if (!p) return false;
        if (p.showOnlineStatus === false) return false;

        // Active user is online if their toggle is on
        if (currentUser && (p.id === currentUser.id || (p.username && p.username.toLowerCase() === currentUser.username.toLowerCase()))) {
          return currentUser.showOnlineStatus !== false;
        }

        const idStr = String(p.id).toLowerCase();
        const userStr = String(p.username || '').toLowerCase();

        // 1. Live presence in Supabase Realtime channel
        if (onlinePresenceKeys.has(idStr) || (userStr && onlinePresenceKeys.has(userStr))) {
          return true;
        }

        // 2. Heartbeat within 90 seconds
        if (p.lastSeen) {
          const diffSec = (Date.now() - new Date(p.lastSeen).getTime()) / 1000;
          if (diffSec < 90) return true;
        }

        return false;
      }, [onlinePresenceKeys, currentUser]);

      // Load all conversation messages involving currentUser from Supabase cloud table
      const loadAllUserMessages = useCallback(async () => {
        if (!supabaseClient || !currentUser) return;
        try {
          const myId = currentUser.id;
          const myUser = currentUser.username;
          const filterParts = [`sender_id.eq.${myId}`, `receiver_id.eq.${myId}`];
          if (myUser) {
            filterParts.push(`sender_id.eq.${myUser}`, `receiver_id.eq.${myUser}`);
          }

          const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .or(filterParts.join(','))
            .order('created_at', { ascending: true });

          if (!error && Array.isArray(data)) {
            setChatMessages(prev => {
              const updated = { ...prev };
              data.forEach(m => {
                const isSentByMe = m.sender_id === myId || (myUser && String(m.sender_id).toLowerCase() === myUser.toLowerCase());
                const partnerKey = isSentByMe ? m.receiver_id : m.sender_id;
                if (!partnerKey) return;

                const msgObj = {
                  id: m.id,
                  senderId: m.sender_id,
                  senderUsername: isSentByMe ? myUser : (m.sender_username || partnerKey),
                  text: m.text,
                  mediaUrl: m.media_url,
                  audioUrl: m.audio_url,
                  reactions: {},
                  timestamp: new Date(m.created_at || Date.now()).getTime(),
                  createdAt: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                const existingList = updated[partnerKey] || [];
                if (!existingList.some(x => String(x.id) === String(m.id))) {
                  updated[partnerKey] = [...existingList, msgObj];
                }
              });
              return updated;
            });
          }
        } catch (e) {
          console.warn('Error loading messages from Supabase:', e);
        }
      }, [supabaseClient, currentUser]);

      // Trigger message loader whenever currentUser changes
      useEffect(() => {
        if (currentUser && supabaseClient) {
          loadAllUserMessages();
        }
      }, [currentUser, supabaseClient, loadAllUserMessages]);

      // Real-time online presence tracking via Supabase Realtime Presence
      useEffect(() => {
        if (!supabaseClient) return;

        const presChan = supabaseClient.channel('rafikimeet_presence', {
          config: {
            presence: {
              key: currentUser ? String(currentUser.id) : `guest_${Math.random().toString(36).substring(2, 7)}`
            }
          }
        });

        const syncPresence = () => {
          try {
            const state = presChan.presenceState();
            const activeSet = new Set();
            Object.keys(state).forEach(key => {
              activeSet.add(key.toLowerCase());
              (state[key] || []).forEach(item => {
                if (item.userId) activeSet.add(String(item.userId).toLowerCase());
                if (item.username) activeSet.add(String(item.username).toLowerCase());
              });
            });
            setOnlinePresenceKeys(activeSet);
          } catch(e) {}
        };

        presChan
          .on('presence', { event: 'sync' }, syncPresence)
          .on('presence', { event: 'join' }, syncPresence)
          .on('presence', { event: 'leave' }, syncPresence)
          .subscribe(async (status) => {
            if (status === 'SUBSCRIBED' && currentUser && currentUser.showOnlineStatus !== false) {
              try {
                await presChan.track({
                  userId: currentUser.id,
                  username: currentUser.username,
                  onlineAt: new Date().toISOString()
                });
                supabaseClient.from('profiles').update({
                  last_seen: new Date().toISOString(),
                  is_online: true
                }).eq('id', currentUser.id).then();
              } catch(e) {}
            }
          });

        let heartbeatTimer = null;
        if (currentUser && currentUser.showOnlineStatus !== false) {
          heartbeatTimer = setInterval(() => {
            try {
              supabaseClient.from('profiles').update({
                last_seen: new Date().toISOString(),
                is_online: true
              }).eq('id', currentUser.id).then();
            } catch(e) {}
          }, 45000);
        }

        const onExit = () => {
          try {
            presChan.untrack();
            if (currentUser) {
              supabaseClient.from('profiles').update({
                is_online: false,
                last_seen: new Date().toISOString()
              }).eq('id', currentUser.id).then();
            }
          } catch(e) {}
        };

        window.addEventListener('beforeunload', onExit);

        return () => {
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          window.removeEventListener('beforeunload', onExit);
          try { presChan.untrack(); } catch(e) {}
          supabaseClient.removeChannel(presChan);
        };
      }, [supabaseClient, currentUser]);


      // Real-time Chat message listener & Video Call signaling channel
      useEffect(() => {
        if (!supabaseClient || !currentUser) return;

        realtimeChannelRef.current = liveSyncChan;

        liveSyncChan
          .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'messages'
          }, (payload) => {
            const incoming = payload.new;
            if (!incoming) return;

            const myId = currentUser.id;
            const myUser = currentUser.username;
            const isForMe = incoming.receiver_id === myId || (myUser && String(incoming.receiver_id).toLowerCase() === myUser.toLowerCase());
            const isSentByMe = incoming.sender_id === myId || (myUser && String(incoming.sender_id).toLowerCase() === myUser.toLowerCase());

            if (!isForMe && !isSentByMe) return;

            // Detect incoming video call trigger message
            if (isForMe && incoming.text && incoming.text.includes('Incoming Video Call')) {
              const callerProf = profiles.find(p => p.id === incoming.sender_id || String(p.username || '').toLowerCase() === String(incoming.sender_id).toLowerCase());
              setIncomingCall({
                callId: `call_${incoming.id || Date.now()}`,
                callerId: incoming.sender_id,
                callerUsername: callerProf?.username || incoming.sender_id,
                callerDisplayName: callerProf?.displayName || incoming.sender_id,
                callerAvatar: callerProf ? resolveAvatar(callerProf.avatarUrl) : DARK_DEFAULT_AVATAR,
                timestamp: Date.now()
              });
              if (soundEnabled) SoundFX.startIncomingRingtone();
              return;
            }

            const partnerKey = isSentByMe ? incoming.receiver_id : incoming.sender_id;
            const formatted = {
              id: incoming.id || Date.now(),
              senderId: incoming.sender_id,
              senderUsername: isSentByMe ? myUser : (incoming.sender_username || partnerKey),
              text: incoming.text,
              mediaUrl: incoming.media_url,
              audioUrl: incoming.audio_url,
              reactions: {},
              timestamp: new Date(incoming.created_at || Date.now()).getTime(),
              createdAt: new Date(incoming.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            setChatMessages(prev => {
              const prevList = prev[partnerKey] || [];
              // Deduplicate optimistically added messages so they never show twice
              const matchIdx = prevList.findIndex(x => 
                String(x.id) === String(formatted.id) ||
                (x.senderId === formatted.senderId && x.text === formatted.text && Math.abs(x.timestamp - formatted.timestamp) < 15000)
              );
              if (matchIdx !== -1) {
                const copy = [...prevList];
                copy[matchIdx] = formatted;
                return {
                  ...prev,
                  [partnerKey]: copy
                };
              }
              return {
                ...prev,
                [partnerKey]: [...prevList, formatted]
              };
            });

            // Notification for incoming message from other user
            if (isForMe && !isSentByMe) {
              if (soundEnabled) SoundFX.playDing();
              setUnreadCount(c => c + 1);

              const isChattingWithSender = activeChatUser && (
                activeChatUser.id === incoming.sender_id ||
                String(activeChatUser.username).toLowerCase() === String(incoming.sender_id).toLowerCase()
              );

              if (!isChattingWithSender) {
                const senderProf = profiles.find(p => p.id === incoming.sender_id || String(p.username || '').toLowerCase() === String(incoming.sender_id).toLowerCase());
                const notif = {
                  senderId: incoming.sender_id,
                  senderUsername: senderProf?.username || incoming.sender_id,
                  senderAvatar: senderProf ? resolveAvatar(senderProf.avatarUrl) : DARK_DEFAULT_AVATAR,
                  text: incoming.text || (incoming.media_url ? '📷 Sent a photo' : '🎙️ Sent a voice note'),
                  timestamp: Date.now()
                };
                setMessageNotification(notif);
                setTimeout(() => {
                  setMessageNotification(curr => (curr && curr.timestamp === notif.timestamp) ? null : curr);
                }, 6000);

                // Browser Push Notification if granted
                if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'granted') {
                  try {
                    new Notification(`RafikiMeet: Message from @${notif.senderUsername}`, {
                      body: notif.text,
                      icon: notif.senderAvatar
                    });
                  } catch (e) {}
                }
              }
            }
          })
          .on('broadcast', { event: 'video_call_signal' }, async ({ payload }) => {
            if (!payload) return;
            const myId = currentUser.id;
            const myUser = currentUser.username;
            const isForMe = payload.receiverId === myId || (myUser && String(payload.receiverUsername).toLowerCase() === myUser.toLowerCase());

            if (payload.type === 'CALL_OFFER' && isForMe && payload.callerId !== myId) {
              setIncomingCall(payload);
              if (soundEnabled) SoundFX.startIncomingRingtone();

              if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'granted') {
                try {
                  new Notification(`📞 Incoming Video Call from @${payload.callerUsername}`, {
                    body: `${payload.callerDisplayName || payload.callerUsername} is calling you live on RafikiMeet`,
                    icon: payload.callerAvatar
                  });
                } catch (e) {}
              }
            } else if (payload.type === 'CALL_ACCEPTED' && isForMe) {
              // Caller receives acceptance from Callee: initiate WebRTC Offer
              SoundFX.stopIncomingRingtone();
              const targetUserId = payload.responderId;
              const pc = createPeerConnection(targetUserId);

              try {
                const offer = await pc.createOffer({
                  offerToReceiveAudio: true,
                  offerToReceiveVideo: true
                });
                await pc.setLocalDescription(offer);

                realtimeChannelRef.current?.send({
                  type: 'broadcast',
                  event: 'video_call_signal',
                  payload: {
                    type: 'WEBRTC_OFFER',
                    sdp: offer,
                    senderId: currentUser.id,
                    receiverId: targetUserId
                  }
                });
              } catch(err) {
                console.warn('WebRTC createOffer error:', err);
              }
            } else if (payload.type === 'WEBRTC_OFFER' && isForMe) {
              // Callee receives offer: set remote description and send WebRTC Answer
              const targetUserId = payload.senderId;
              let pc = peerConnectionRef.current;
              if (!pc) {
                pc = createPeerConnection(targetUserId);
              }

              try {
                await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));

                // Process queued ICE candidates
                while (iceCandidatesQueue.current.length > 0) {
                  const cand = iceCandidatesQueue.current.shift();
                  try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch(e) {}
                }

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                realtimeChannelRef.current?.send({
                  type: 'broadcast',
                  event: 'video_call_signal',
                  payload: {
                    type: 'WEBRTC_ANSWER',
                    sdp: answer,
                    senderId: currentUser.id,
                    receiverId: targetUserId
                  }
                });
              } catch(err) {
                console.warn('WebRTC setRemoteDescription/createAnswer error:', err);
              }
            } else if (payload.type === 'WEBRTC_ANSWER' && isForMe) {
              // Caller receives answer: set remote description and flush candidates
              const pc = peerConnectionRef.current;
              if (pc) {
                try {
                  await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                  while (iceCandidatesQueue.current.length > 0) {
                    const cand = iceCandidatesQueue.current.shift();
                    try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch(e) {}
                  }
                } catch(err) {
                  console.warn('WebRTC setRemoteDescription answer error:', err);
                }
              }
            } else if (payload.type === 'WEBRTC_ICE_CANDIDATE' && isForMe) {
              // Handle ICE candidates
              const pc = peerConnectionRef.current;
              if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                try {
                  await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
                } catch(e) {}
              } else {
                iceCandidatesQueue.current.push(payload.candidate);
              }
            } else if (payload.type === 'CALL_DECLINED' && payload.receiverId === myId) {
              setAuthNotice(`@${payload.responderUsername || 'User'} declined the video call.`);
              setTimeout(() => setAuthNotice(''), 4000);
              endVideoCall();
            } else if (payload.type === 'CALL_ENDED' && (payload.receiverId === myId || isForMe)) {
              SoundFX.stopIncomingRingtone();
              setIncomingCall(null);
              if (peerConnectionRef.current) {
                try { peerConnectionRef.current.close(); } catch(e) {}
                peerConnectionRef.current = null;
              }
              iceCandidatesQueue.current = [];
              if (cameraStreamRef.current) {
                cameraStreamRef.current.getTracks().forEach(t => t.stop());
                cameraStreamRef.current = null;
              }
              if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
              if (localVideoRef.current) localVideoRef.current.srcObject = null;
              setIsCallActive(false);
              setActiveVideoUser(null);
            }
          })
